# mise.toml — toolchain and task runner for Corridor.
# Run `mise install` after clone to provision exact versions.
# Run `mise tasks` to list everything below.

[tools]
node = "20"
pnpm = "9"
postgres = "15"

[env]
NODE_ENV = "development"
TZ = "America/Denver"
_.file = ".env.local"  # gitignored; auto-loaded for all tasks if present

# ----- bootstrap -----

[tasks.install]
description = "Install workspace deps"
run = "pnpm install"

# ----- dev servers -----

[tasks.dev]
description = "Start Docker infra, then run API, workers, and both frontends"
depends = ["dev:infra"]
run = "pnpm run dev:all"

[tasks."dev:infra"]
description = "Start local Docker Postgres and Redis"
run = "pnpm run dev:infra"

[tasks."dev:app"]
description = "Sponsor + ETC + internal admin portal"
run = "pnpm --filter app dev"

[tasks."dev:patient"]
description = "Patient portal"
run = "pnpm --filter patient dev"

[tasks."dev:api"]
description = "Hono API"
run = "pnpm --filter api dev"

[tasks."dev:workers"]
description = "BullMQ workers"
run = "pnpm --filter workers dev"

[tasks."dev:all"]
description = "Run API, workers, and both frontends without starting Docker infra"
run = "pnpm run dev:all"

# ----- static checks -----

[tasks.typecheck]
description = "tsc --noEmit across workspace"
run = "pnpm -r typecheck"

[tasks.lint]
description = "eslint"
run = "pnpm -r lint"

[tasks."lint:fix"]
description = "eslint --fix"
run = "pnpm -r lint:fix"

[tasks.format]
description = "prettier --write"
run = "pnpm prettier --write ."

[tasks."format:check"]
description = "prettier --check (CI)"
run = "pnpm prettier --check ."

# ----- tests -----

[tasks.test]
description = "vitest unit + integration"
run = "pnpm -r test"

[tasks."test:watch"]
run = "pnpm -r test:watch"

[tasks."test:e2e"]
description = "playwright"
depends = ["db:up"]
run = "pnpm test:e2e"

[tasks."test:a11y"]
description = "axe-core via playwright — required for patient portal changes"
depends = ["db:up"]
run = "pnpm test:a11y"

# ----- build -----

[tasks.build]
description = "production builds (all apps)"
depends = ["typecheck"]
run = "pnpm -r build"

# ----- database -----

[tasks."db:up"]
description = "Start local Docker Postgres"
run = "docker compose up -d postgres"

[tasks."db:down"]
description = "Stop local Docker Postgres"
run = "docker compose stop postgres"

[tasks."db:reset"]
description = "Wipe and re-migrate local DB"
run = [
  "docker compose down -v",
  "docker compose up -d postgres redis",
  "pnpm run db:migrate",
  "pnpm run db:seed",
]

[tasks."db:migrate"]
description = "Apply SQL migrations against local Docker Postgres"
depends = ["db:up"]
run = "pnpm run db:migrate"

[tasks."db:generate"]
description = "Generate migration from schema diff"
run = "pnpm --filter db generate"

[tasks."db:rls:test"]
description = "pgTAP — every PHI table must have RLS coverage"
depends = ["db:up"]
run = "pnpm --filter @corridor/db rls:test"

[tasks."db:rls:coverage"]
description = "Static check — every RLS-enabled table has SELECT + write policies"
run = "pnpm --filter @corridor/db rls:coverage"

[tasks."db:seed"]
description = "Seed local dev data — NEVER run against staging or prod"
depends = ["db:migrate"]
run = "pnpm run db:seed"

# ----- meta -----

[tasks.ci]
description = "Pre-merge gate — matches CI exactly"
depends = ["typecheck", "lint", "format:check", "test", "test:a11y", "db:rls:coverage", "db:rls:test"]

[tasks.down]
description = "Shut everything down — Docker infra and local dev servers"
run = [
  "docker compose down || true",
  "pkill -f 'pnpm.*dev' || true",
  "pkill -f 'vite' || true",
  "pkill -f 'tsx.*watch' || true",
]
