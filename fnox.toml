    "VITE_CLERK_PUBLISHABLE_KEY",
    "VITE_STRIPE_PUBLISHABLE_KEY",
    "VITE_SENTRY_DSN",
    "VITE_API_BASE_URL",
]

[profiles.frontend_patient_dev]
