# Local + CI secrets for Corridor. Production lives in Vercel/Railway env vars.
# Adding yourself: generate a key (`age-keygen -o ~/.config/corridor-age-maintainer.key`),
# share your pubkey with an existing recipient, who appends it below and re-encrypts
# every secret (`fnox reencrypt`).

default_provider = "age"
age_key_file = "~/.config/corridor-age-maintainer.key"
if_missing = "warn"  # secrets without encrypted values warn instead of crashing dev

[providers.age]
type = "age"
recipients = [
  "age1m94qg8j6ylpqem2sucdeduhqtr4vdr2ryyal44jdcdq8x59um5lsjn378u",  # gabeviggers@corridor.health
  "age18yac0966xfuhkzcz3lwepm4ncm04wuccftv4vh5kpch3mpv4qsfqfw0g9a",  # ci@corridor.health
]

# Secrets are added with `fnox set --profile <name> <KEY> <value>` and stored
# encrypted in this file. The empty profiles below define which env vars each
# runtime expects — fill them as you connect each provider account.

[profiles.api_dev.secrets]
CLERK_SECRET_KEY = { provider = "age" }
CLERK_WEBHOOK_SECRET = { provider = "age" }
STRIPE_SECRET_KEY = { provider = "age" }
STRIPE_WEBHOOK_SECRET = { provider = "age" }
PLAID_CLIENT_ID = { provider = "age" }
PLAID_SECRET = { provider = "age" }
PLAID_WEBHOOK_SECRET = { provider = "age" }
RESEND_API_KEY = { provider = "age" }
RESEND_WEBHOOK_SECRET = { provider = "age" }
SENTRY_DSN = { provider = "age" }
SUPABASE_URL = { provider = "age" }
DAILY_API_KEY = { provider = "age" }
ESIGN_API_KEY = { provider = "age" }

[profiles.workers_dev.secrets]
CLERK_SECRET_KEY = { provider = "age" }
STRIPE_SECRET_KEY = { provider = "age" }
RESEND_API_KEY = { provider = "age" }
SENTRY_DSN = { provider = "age" }
SUPABASE_URL = { provider = "age" }
REDIS_URL = { provider = "age" }

[profiles.workers_elevated_dev.secrets]
SENTRY_DSN = { provider = "age" }
SUPABASE_SERVICE_ROLE_KEY = { provider = "age" }
SUPABASE_URL = { provider = "age" }
REDIS_URL = { provider = "age" }

[profiles.frontend_app_dev.secrets]
VITE_CLERK_PUBLISHABLE_KEY = { provider = "age" }
VITE_STRIPE_PUBLISHABLE_KEY = { provider = "age" }
VITE_SENTRY_DSN = { provider = "age" }
VITE_API_BASE_URL = { provider = "age" }

[profiles.frontend_patient_dev.secrets]
VITE_CLERK_PUBLISHABLE_KEY = { provider = "age" }
VITE_STRIPE_PUBLISHABLE_KEY = { provider = "age" }
VITE_SENTRY_DSN = { provider = "age" }
VITE_API_BASE_URL = { provider = "age" }

# Directory (corridor.health) is anonymous-first: it does NOT receive
# Stripe/Plaid credentials and Clerk is only used at the connect-request
# handoff. Keeping the surface area minimal makes the "directory bundle has
# no PHI code paths" pen-test posture verifiable.
[profiles.frontend_directory_dev.secrets]
VITE_API_BASE_URL = { provider = "age" }
VITE_CLERK_PUBLISHABLE_KEY = { provider = "age" }
VITE_SENTRY_DSN = { provider = "age" }
VITE_POSTHOG_KEY = { provider = "age" }

[profiles.ci.secrets]
CLERK_SECRET_KEY = { provider = "age" }
CLERK_WEBHOOK_SECRET = { provider = "age" }
STRIPE_SECRET_KEY = { provider = "age" }
STRIPE_WEBHOOK_SECRET = { provider = "age" }
PLAID_SECRET = { provider = "age" }
RESEND_API_KEY = { provider = "age" }
SENTRY_DSN = { provider = "age" }
SUPABASE_URL = { provider = "age" }
