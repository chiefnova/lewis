# Local + CI secrets for Lewis. Production lives in Vercel/Railway env vars.
# Adding yourself: generate a key (`age-keygen -o ~/.config/lewis-age-maintainer.key`),
# share your pubkey with an existing recipient, who appends it below and re-encrypts
# every secret (`fnox reencrypt`).

default_provider = "age"
age_key_file = "~/.config/lewis-age-maintainer.key"
if_missing = "warn"  # secrets without encrypted values warn instead of crashing dev

[providers.age]
type = "age"
recipients = [
  "age1m94qg8j6ylpqem2sucdeduhqtr4vdr2ryyal44jdcdq8x59um5lsjn378u",  # gabeviggers@lewis.health
  "age18yac0966xfuhkzcz3lwepm4ncm04wuccftv4vh5kpch3mpv4qsfqfw0g9a",  # ci@lewis.health
]

# Secrets are added with `fnox set --profile <name> <KEY> <value>` and stored
# encrypted in this file. The empty profiles below define which env vars each
# runtime expects — fill them as you connect each provider account.
#
# DEFERRED services (commented out below until provider accounts are created
# and the corresponding webhook endpoints / SDKs go live):
#   - Stripe       (subscriptions + ACH disbursements; PRD § 14)
#   - Plaid        (bank linking for ACH; PRD § 14.4)
#   - Resend       (transactional email; PRD § 13)
#   - Sentry       (frontend + backend error reporting; PRD § 18)
#   - PostHog      (anonymous directory analytics; PRD § 18.4)
# App code uses each via lazy `requiredEnv()` calls, so the API + workers
# boot fine without them — errors only surface when the corresponding
# webhook route is actually hit, which won't happen until the provider is
# wired and an endpoint is registered. Uncomment the relevant lines (and
# `fnox set` real values) when you onboard each provider.

[profiles.api_dev.secrets]
CLERK_SECRET_KEY= { provider = "age", value = "" }
CLERK_WEBHOOK_SECRET= { provider = "age", value = "" }
# DEFERRED — Stripe (PRD § 14)
# STRIPE_SECRET_KEY = { provider = "age" }
# STRIPE_WEBHOOK_SECRET = { provider = "age" }
# DEFERRED — Plaid (PRD § 14.4)
# PLAID_CLIENT_ID = { provider = "age" }
# PLAID_SECRET = { provider = "age" }
# PLAID_WEBHOOK_SECRET = { provider = "age" }
# DEFERRED — Resend (PRD § 13 — transactional email)
# RESEND_API_KEY = { provider = "age" }
# RESEND_WEBHOOK_SECRET = { provider = "age" }
# DEFERRED — Sentry (PRD § 18)
# SENTRY_DSN = { provider = "age" }
SUPABASE_URL= { provider = "age", value = "" }
# DEFERRED — Daily.co video/recording (PRD § 6 — Sprint 6). No source code consumes
# this yet; uncomment + `fnox set` once the Daily SDK is wired into a worker job.
# DAILY_API_KEY = { provider = "age" }
# DEFERRED — E-signature provider (PRD § 5 — Sprint 5). No source code consumes
# this yet; uncomment + `fnox set` once the e-sign SDK is wired into a worker job.
# ESIGN_API_KEY = { provider = "age" }

