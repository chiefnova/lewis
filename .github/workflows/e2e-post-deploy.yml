name: E2E Tests (Post-Deploy)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "App portal URL to test"
        required: true
        default: "https://app.staging.lewis.health"
      patient_url:
        description: "Patient portal URL to test"
        required: true
        default: "https://patient.staging.lewis.health"
      directory_url:
        description: "Public directory URL to smoke-test"
        required: false
        default: "https://staging.lewis.health"
      api_origin_url:
        description: "API origin URL used for /healthz and /readyz"
        required: false
        default: ""
  workflow_call:
    inputs:
      app_url:
        required: true
        type: string
      patient_url:
        required: true
        type: string
      directory_url:
        required: false
        type: string
      api_origin_url:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise run install

      - name: Verify API liveness and readiness
        if: ${{ inputs.api_origin_url != '' }}
        env:
          API_ORIGIN_URL: ${{ inputs.api_origin_url }}
        run: |
          API_URL="${API_ORIGIN_URL%/}"

          wait_for_endpoint() {
            local url="$1"
            local attempts=40
            local delay=10

            for attempt in $(seq 1 "$attempts"); do
              echo "Checking ${url} (attempt ${attempt}/${attempts})"
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url"; then
                echo
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done

            echo "Timed out waiting for ${url}"
            return 1
          }

          wait_for_endpoint "${API_URL}/healthz"
          wait_for_endpoint "${API_URL}/readyz"

      - name: Verify directory smoke
        if: ${{ inputs.directory_url != '' }}
        env:
          DIRECTORY_URL: ${{ inputs.directory_url }}
        run: |
          DIR_URL="${DIRECTORY_URL%/}"
          echo "Checking ${DIR_URL}/ (homepage)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${DIR_URL}/" -o /dev/null
          echo "Checking ${DIR_URL}/browse (SPA rewrite)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${DIR_URL}/browse" -o /dev/null
          echo "Checking ${DIR_URL}/sitemap.xml"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${DIR_URL}/sitemap.xml" -o /dev/null
          echo "Checking ${DIR_URL}/robots.txt"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${DIR_URL}/robots.txt" -o /dev/null
          echo "directory smoke OK"

      - name: Install Playwright browsers
        run: pnpm --filter directory exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          APP_URL: ${{ inputs.app_url }}
          PATIENT_URL: ${{ inputs.patient_url }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
