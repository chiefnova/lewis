name: Nightly

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install toolchain
        run: mise install
      - name: Install dependencies
        run: mise run install
      - name: TypeScript check
        run: mise run typecheck
      - name: ESLint
        run: mise run lint
      - name: Prettier check
        run: mise run format:check
      - name: Tests
        run: mise run test
      - name: Production build
        run: mise run build

  staging-e2e:
    needs: nightly
    uses: ./.github/workflows/e2e-post-deploy.yml
    with:
      app_url: ${{ vars.STAGING_APP_URL || 'https://app.staging.corridor.health' }}
      patient_url: ${{ vars.STAGING_PATIENT_URL || 'https://patient.staging.corridor.health' }}
      api_origin_url: ${{ vars.STAGING_API_ORIGIN_URL || 'https://api.staging.corridor.health' }}
