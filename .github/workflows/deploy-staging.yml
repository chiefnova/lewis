name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install toolchain
        run: mise install
      - name: Install dependencies
        run: mise run install
      - name: TypeScript check
        run: mise run typecheck
      - name: ESLint
        run: mise run lint
      - name: Prettier check
        run: mise run format:check
      - name: Tests
        run: mise run test
      - name: Production build
        run: mise run build

      # Database migrations run BEFORE any deploy hooks fire. Order:
      #   1. journal drift check (fail fast on stale journal)
      #   2. drizzle-kit migrate against the staging Supabase project
      #
      # MIGRATION_DATABASE_URL must be the Supabase SESSION pooler URL
      # (port 5432 on the pooler hostname) authenticated as the schema-
      # owner role — NEVER the runtime app_api credential. This secret
      # is held only by the GitHub Actions runner for the duration of
      # this step; it is intentionally absent from every Railway service
      # env per CLAUDE.md security #1.
      - name: Verify migration journal in sync
        run: pnpm --filter @lewis/db migrate:journal:check
      - name: Run database migrations (staging)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "STAGING_MIGRATION_DATABASE_URL is not configured."
            exit 1
          fi
          pnpm --filter @lewis/db migrate:cloud

      - name: Deploy directory
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DIRECTORY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "STAGING_DIRECTORY_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Deploy app portal
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_APP_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "STAGING_APP_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Deploy patient portal
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_PATIENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "STAGING_PATIENT_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"

      # Backend services (api, workers) are NOT triggered via deploy-hook
      # POST. Railway auto-deploys on every push to staging via its GitHub
      # integration, and gates the deploy on this CI workflow's status
      # (Wait-for-CI). When the migration step above succeeds, Railway
      # promotes the held deploy. Any deploy-hook URL we'd POST to here
      # doesn't exist as a current Railway feature — that pattern is a
      # Vercel-ism. Vercel hooks above are real; Railway needs nothing.

  e2e:
    needs: deploy-staging
    uses: ./.github/workflows/e2e-post-deploy.yml
    with:
      app_url: ${{ vars.STAGING_APP_URL || 'https://app.staging.lewis.health' }}
      patient_url: ${{ vars.STAGING_PATIENT_URL || 'https://patient.staging.lewis.health' }}
      directory_url: ${{ vars.STAGING_DIRECTORY_URL || 'https://staging.lewis.health' }}
      api_origin_url: ${{ vars.STAGING_API_ORIGIN_URL || 'https://api.staging.lewis.health' }}
